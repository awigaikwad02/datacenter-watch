name: Update data center news

on:
  schedule:
    # Every hour at 17 minutes past (off the top of the hour, when GitHub is busiest)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch feeds and rebuild data files
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/project_candidates.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update news data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
