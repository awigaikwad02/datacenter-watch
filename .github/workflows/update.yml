name: Update data center news

# The data refresh. GitHub starts scheduled workflows late or not at all (in October 2026 an
# hourly cron started only every 3 to 6 hours), so this workflow keeps itself running instead:
# one run loops for about 5 hours 40 minutes, refreshing once an hour (scripts/update_loop.sh),
# then dispatches the next run. The hourly cron and the freshness watchdog (watchdog.yml) only
# restart the loop if the chain ever breaks; a start while a loop is running is skipped.
# No AI service is involved anywhere: every step is deterministic code (see docs/DECISIONS.md).
on:
  schedule:
    - cron: "17 * * * *"   # backup only
  workflow_dispatch:
    inputs:
      chain:
        description: "Started by the previous loop (leave false when starting by hand)"
        type: boolean
        default: false

# contents: commit the data; actions: see whether a loop is already running and start the next one.
permissions:
  contents: write
  actions: write

jobs:
  # Lets this run through only when no other loop is running (or when the previous loop started it).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Is a loop already running?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain }}
        run: |
          if [ "$CHAIN" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$busy" -gt 0 ]; then
            echo "A loop is already running; this start is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  loop:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub stops jobs at 6 hours; the loop ends at 5h40m plus one cycle
    # Shared with the manual news backfill so the two never push the same data files at once.
    concurrency:
      group: data-files
      cancel-in-progress: false
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh once an hour for 5 hours 40 minutes
        run: bash scripts/update_loop.sh

      # Runs even when every cycle failed, so the chain never stops on its own.
      - name: Start the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -f chain=true
