name: Update data center news

on:
  schedule:
    # Every hour at 17 minutes past (off the top of the hour, when GitHub is busiest)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch feeds and rebuild data files
        run: python scripts/fetch_news.py

      # A bad data file must never be committed: if the checks fail, this step fails
      # and the commit step below does not run.
      - name: Check the new data
        run: python scripts/healthcheck.py --context update

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skip the commit when only the "updated" timestamps moved (no new or changed items).
          if ! python scripts/data_changed.py; then
            echo "No changes to commit"
            exit 0
          fi
          git add data/news.json data/project_candidates.json data/status.json data/archive
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update news data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
