name: Freshness watchdog

# Every 2 hours: how old is data/news.json "updated"?
#   older than 3 hours: start the update loop (it skips itself if one is already running)
#   older than 6 hours: also open or update the "Health check failed" issue, which emails the owner
# The health check workflow closes that issue again on its next passing run.
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

# contents: read news.json; actions: start the update workflow; issues: open or update the issue.
permissions:
  contents: read
  actions: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check data age
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hours=$(python3 -c "import json; from datetime import datetime, timezone; u = datetime.fromisoformat(json.load(open('data/news.json'))['updated']); print(int((datetime.now(timezone.utc) - u).total_seconds() // 3600))")
          echo "data/news.json was updated $hours hours ago"
          if [ "$hours" -ge 3 ]; then
            echo "Older than 3 hours: starting the update loop"
            gh workflow run update.yml --ref main
          fi
          if [ "$hours" -ge 6 ]; then
            TITLE="Health check failed"
            num=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
            body="The site's data has not been refreshed for $hours hours (data/news.json \"updated\"). The watchdog started the update workflow; if this stays open, see docs/RUNBOOK.md, \"The data stopped updating\". Checked $(date -u +'%Y-%m-%d %H:%M UTC')."
            if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
          fi
